<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify</title>
    
    <!-- App & PWA Meta Tags -->
    <meta name="application-name" content="Spotify">
    <meta name="apple-mobile-web-app-title" content="Spotify">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#121212">

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="shortcut icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="apple-touch-icon" sizes="180x180" href="logo.png">
    
    <!-- Web Application Manifest (Inline Data URI for all-in-one compatibility) -->
    <link rel="manifest" href="data:application/manifest+json;utf8,%7B%22name%22%3A%22Spotify%22%2C%22short_name%22%3A%22Spotify%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23121212%22%2C%22theme_color%22%3A%22%23121212%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22logo.png%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fpng%22%7D%2C%7B%22src%22%3A%22logo.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        spotify: {
                            green: '#1DB954',
                            hover: '#1ed760',
                            black: '#121212',
                            card: '#181818',
                            hovercard: '#282828',
                            gray: '#b3b3b3'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #121212;
            color: #ffffff;
        }
        
        /* Smooth tab fade transitions */
        .playlist-tab {
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }
        .playlist-tab.hidden-tab {
            display: none;
            opacity: 0;
            transform: translateY(10px);
        }
        .playlist-tab.active-tab {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-4 sm:p-6 md:p-10 select-none">

    <!-- Header Section -->
    <header class="text-center my-6 max-w-xl w-full">
        <div class="inline-flex items-center justify-center space-x-2 mb-3">
            <!-- Spotify Logo SVG -->
            <svg class="w-8 h-8 text-spotify-green fill-current" viewBox="0 0 24 24">
                <path d="M12 0C5.376 0 0 5.376 0 12s5.376 12 12 12 12-5.376 12-12S18.624 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141 C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.18-.1.2-.24-.6-.18-.6.2-1.2.8-1.38 4.26-1.26 11.28-1.02 15.72 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.279z"/>
            </svg>
            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Spotify</h1>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="w-full max-w-lg bg-spotify-card border border-neutral-800 rounded-2xl p-4 sm:p-6 shadow-2xl backdrop-blur-sm my-auto">
        
        <!-- Toggle Control Bar -->
        <div class="bg-neutral-900/80 p-1.5 rounded-xl flex items-center justify-between mb-6 border border-neutral-800">
            <button 
                id="btn-playlist-1" 
                onclick="switchPlaylist(1)" 
                class="flex-1 py-2.5 px-4 rounded-lg font-semibold text-sm transition-all duration-200 text-black bg-spotify-green shadow-md flex items-center justify-center space-x-2">
                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                <span>Playlist 1</span>
            </button>
            <button 
                id="btn-playlist-2" 
                onclick="switchPlaylist(2)" 
                class="flex-1 py-2.5 px-4 rounded-lg font-semibold text-sm transition-all duration-200 text-spotify-gray hover:text-white flex items-center justify-center space-x-2">
                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                <span>Playlist 2</span>
            </button>
        </div>

        <!-- Playlist Frame 1 -->
        <div id="playlist-1" class="playlist-tab active-tab">
            <div class="rounded-xl overflow-hidden shadow-lg border border-neutral-800/50">
                <iframe 
                    data-testid="embed-iframe" 
                    style="border-radius:12px" 
                    src="https://open.spotify.com/embed/playlist/6zGUOPjGy1UVyWoGIhMB4k?utm_source=generator&si=3648c5c8f5734a32" 
                    width="100%" 
                    height="352" 
                    frameBorder="0" 
                    allowfullscreen="" 
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
                    loading="lazy">
                </iframe>
            </div>
        </div>

        <!-- Playlist Frame 2 -->
        <div id="playlist-2" class="playlist-tab hidden-tab">
            <div class="rounded-xl overflow-hidden shadow-lg border border-neutral-800/50">
                <iframe 
                    data-testid="embed-iframe" 
                    style="border-radius:12px" 
                    src="https://open.spotify.com/embed/playlist/5Bt28105XqH6vy7djMkWjZ?utm_source=generator&si=e1ad2fe4eb3b4f7d" 
                    width="100%" 
                    height="352" 
                    frameBorder="0" 
                    allowfullscreen="" 
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
                    loading="lazy">
                </iframe>
            </div>
        </div>
    </main>

    <!-- Toggle Script Logic -->
    <script>
        function switchPlaylist(playlistNum) {
            const p1 = document.getElementById('playlist-1');
            const p2 = document.getElementById('playlist-2');
            const btn1 = document.getElementById('btn-playlist-1');
            const btn2 = document.getElementById('btn-playlist-2');

            if (playlistNum === 1) {
                p1.classList.remove('hidden-tab');
                p1.classList.add('active-tab');
                p2.classList.remove('active-tab');
                p2.classList.add('hidden-tab');

                btn1.className = 'flex-1 py-2.5 px-4 rounded-lg font-semibold text-sm transition-all duration-200 text-black bg-spotify-green shadow-md flex items-center justify-center space-x-2';
                btn2.className = 'flex-1 py-2.5 px-4 rounded-lg font-semibold text-sm transition-all duration-200 text-spotify-gray hover:text-white flex items-center justify-center space-x-2';
            } else {
                p2.classList.remove('hidden-tab');
                p2.classList.add('active-tab');
                p1.classList.remove('active-tab');
                p1.classList.add('hidden-tab');

                btn2.className = 'flex-1 py-2.5 px-4 rounded-lg font-semibold text-sm transition-all duration-200 text-black bg-spotify-green shadow-md flex items-center justify-center space-x-2';
                btn1.className = 'flex-1 py-2.5 px-4 rounded-lg font-semibold text-sm transition-all duration-200 text-spotify-gray hover:text-white flex items-center justify-center space-x-2';
            }
        }
    </script>
</body>
</html>
